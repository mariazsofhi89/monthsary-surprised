<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 1st Monthsary My Love</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', 'Quicksand', sans-serif;
        }

        body {
            background-color: #ffe6ee;
            background-image: 
                radial-gradient(#ffb6c1 15%, transparent 16%),
                radial-gradient(#ffccd5 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            border-radius: 35px;
            border: 4px solid #ff9ebb;
            box-shadow: 0 15px 30px rgba(255, 158, 187, 0.3);
            padding: 30px 25px;
            position: relative;
            overflow: hidden;
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        .screen.active {
            display: block;
        }

        .header-ribbon {
            background: #ff85a1;
            color: #ffffff;
            display: inline-block;
            padding: 8px 25px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 5px 12px rgba(255, 133, 161, 0.3);
            margin-bottom: 15px;
            border: 2px solid #ffffff;
        }

        .title {
            color: #ff477e;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #ff9ebb;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* Password Input Box */
        .pass-box {
            margin: 20px 0;
        }

        .pass-input {
            width: 80%;
            padding: 12px;
            border: 3px solid #ff9ebb;
            border-radius: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: #ff477e;
            outline: none;
            letter-spacing: 4px;
        }

        .pass-input:focus {
            border-color: #ff477e;
        }

        .error-msg {
            color: #ff3366;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
            display: none;
        }

        /* Question Buttons */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            background: #ff85a1;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 0 #ff477e;
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #ff477e;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #ff477e;
        }

        .btn:disabled {
            background: #ffd1dc;
            box-shadow: 0 6px 0 #fca3b7;
            cursor: not-allowed;
            transform: none;
        }

        /* Slides Styling */
        .slides-container {
            position: relative;
            min-height: 380px;
        }

        .slide {
            display: none;
            background: #fff8fa;
            border: 3px dashed #ffb6c1;
            border-radius: 25px;
            padding: 28px 22px;
            animation: kawaiiPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative;
        }

        .slide.active {
            display: block;
        }

        .slide-badge {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffe6ed;
            color: #ff477e;
            border: 2px solid #ff85a1;
            padding: 3px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .slide-text {
            color: #5a4b51;
            font-size: 14.5px;
            line-height: 1.8;
            text-align: justify;
            margin-top: 10px;
